name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # unit tests (stdlib unittest — the tools have no runtime deps)
      - name: tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      # ruff = pyflakes (F: unused/undefined) + real-bug checks (E4/E7/E9).
      # OS-independent, so run once on Linux. `make lint-py` == `ruff check .`,
      # matching `make check` locally (config in ruff.toml).
      - name: ruff
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --quiet "ruff>=0.15,<0.16"
          make lint-py

  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # syntax gate: must be clean for every shell script (incl. extensionless)
      # macos runs bash 3.2, so this also catches bash-4-only syntax
      - name: bash -n
        shell: bash
        run: |
          set -e
          scripts="$(find . -path ./.git -prune -o -name '*.sh' -print)"
          scripts="$scripts goodpomo/goodpomo goodnerd/goodnerd lib/shims/python3"
          scripts="$scripts goodcheats/good goodcheats/goodcheat goodcheats/goodharness"
          for f in $scripts; do
            [ -f "$f" ] || continue
            echo "checking $f"
            bash -n "$f"
          done

      # shellcheck at --severity=warning — catches real bugs (rm safety, masked
      # return values, ls|grep). Noise (SC2034/SC1090) is disabled in
      # .shellcheckrc. OS-independent, so run once on Linux (preinstalled there).
      # `make lint-sh` matches `make check` locally.
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck --version
          make lint-sh

      # functional smoke test for goodharness (bundle presets, init, config)
      # jq is preinstalled on ubuntu and macos runners; windows runs it via Git Bash
      - name: goodharness tests
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash tests/test_goodharness.sh
