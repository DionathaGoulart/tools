name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # unit tests (stdlib unittest — the tools have no runtime deps)
      - name: tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      # unused imports / obvious mistakes across every python entrypoint
      - name: pyflakes
        shell: bash
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes \
            lib/llm.py lib/retro.py \
            dark/dark goodivers/goodivers goodvocab/goodvocab \
            goodprof/goodprof goodbio/goodbio \
            goodzap/goodzap images/goodpixel/goodpixel

  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # syntax gate: must be clean for every shell script (incl. extensionless)
      # macos runs bash 3.2, so this also catches bash-4-only syntax
      - name: bash -n
        shell: bash
        run: |
          set -e
          scripts="$(find . -path ./.git -prune -o -name '*.sh' -print)"
          scripts="$scripts goodpomo/goodpomo goodnerd/goodnerd lib/shims/python3"
          scripts="$scripts goodcheats/good goodcheats/goodcheat goodcheats/goodharness"
          for f in $scripts; do
            [ -f "$f" ] || continue
            echo "checking $f"
            bash -n "$f"
          done

      # shellcheck at error severity — fails only on real bugs, not style nits
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          scripts="$(find . -path ./.git -prune -o -name '*.sh' -print)"
          scripts="$scripts goodpomo/goodpomo goodnerd/goodnerd lib/shims/python3"
          scripts="$scripts goodcheats/good goodcheats/goodcheat goodcheats/goodharness"
          # shellcheck is preinstalled on ubuntu-latest runners
          shellcheck -S error $scripts

      # functional smoke test for goodharness (bundle presets, init, config)
      # jq is preinstalled on ubuntu and macos runners; windows runs it via Git Bash
      - name: goodharness tests
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash tests/test_goodharness.sh
